<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通讯录</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-icon" data-icon="user" aria-hidden="true"></span><strong>通讯录</strong></div><nav id="navigation"><button data-view="all" class="nav active"><span data-icon="users" aria-hidden="true"></span>所有联系人 <b id="total">0</b></button><button data-view="favorites" class="nav"><span data-icon="star" aria-hidden="true"></span>收藏 <b id="favorites-count">0</b></button><button data-view="recent" class="nav"><span data-icon="clock" aria-hidden="true"></span>最近添加 <b id="recent-count">0</b></button></nav><div class="section-label">分组 <button id="add-group" aria-label="创建分组"><span data-icon="plus" aria-hidden="true"></span></button></div><div id="groups"></div><div class="dashboard"><h3><span data-icon="overview" aria-hidden="true"></span>数据概览</h3><div>联系人总数 <b id="stat-total">0</b></div><div>收藏人数 <b id="stat-favorites">0</b></div><div>分组数量 <b id="stat-groups">0</b></div><div>最近新增 <b id="stat-recent">0</b></div></div></aside>
<section class="workspace"><header class="topbar"><span>联系人</span><div><button class="new-contact" id="new-contact" type="button"><span data-icon="plus" aria-hidden="true"></span> 新建联系人</button><button class="icon-button" id="theme" title="切换深色模式" aria-label="深色模式" aria-pressed="false"></button></div></header><div class="content"><section class="list-panel"><div class="search-row"><label class="search"><span data-icon="search" aria-hidden="true"></span><input id="search" type="search" placeholder="搜索联系人…" aria-label="搜索联系人"></label><select id="sort" aria-label="排序"><option value="name">姓名排序</option><option value="recent">最近创建</option><option value="oldest">最早创建</option></select></div><div class="filter-row"><span id="list-heading">所有联系人</span><select id="tag-filter" aria-label="按标签筛选"><option value="">所有标签</option></select></div><div id="contact-list" class="contact-list"></div></section><section class="detail-panel" id="detail"></section></div></section></div>
<dialog id="editor" aria-labelledby="form-title"><form id="contact-form"><div class="dialog-head"><h2 id="form-title">新增联系人</h2><button type="button" class="close" id="close-editor" aria-label="关闭">×</button></div><div class="form-grid"><label>姓名 <input name="name" required maxlength="120" placeholder="输入姓名"></label><label>头像 <input id="avatar-file" type="file" accept="image/*"><small>可选，图片不超过 1 MB</small></label><label class="wide">备注 <textarea name="notes" rows="3" placeholder="添加备注"></textarea></label><div class="wide"><div class="field-head"><label>联系方式</label><button type="button" class="text-button" id="add-method">＋ 添加</button></div><div id="method-list"></div></div><fieldset class="wide"><legend>分组</legend><div id="group-options" class="choices"></div></fieldset><label class="wide">标签 <input name="tags" placeholder="多个标签用逗号分隔"></label><label class="wide checkbox"><input type="checkbox" name="favorite"> 收藏联系人</label></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">保存联系人</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
